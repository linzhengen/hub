components:
    schemas:
        UserServiceAddGroupsToUserBody:
            properties:
                expiresAt:
                    description: |-
                        When the grant lapses. Leave it unset to grant for good, which is what
                        every grant made before this field existed did.

                        It applies to each id in this request, since one call is one decision:
                        "give them these three until Friday". A grant with a different term is a
                        different decision, so it is a different call.
                    format: date-time
                    type: string
                groupIds:
                    items:
                        type: string
                    type: array
            type: object
        UserServiceRemoveGroupsFromUserBody:
            properties:
                groupIds:
                    items:
                        type: string
                    type: array
            type: object
        UserServiceUpdateUserBody:
            properties:
                email:
                    type: string
                groupIds:
                    items:
                        type: string
                    type: array
                password:
                    type: string
                status:
                    $ref: '#/components/schemas/v1UserStatus'
                username:
                    type: string
            type: object
        googleRpcStatus:
            properties:
                code:
                    format: int32
                    type: integer
                details:
                    items:
                        $ref: '#/components/schemas/protobufAny'
                    type: array
                message:
                    type: string
            type: object
        protobufAny:
            additionalProperties: {}
            properties:
                '@type':
                    type: string
            type: object
        resourceV1Type:
            default: TYPE_UNSPECIFIED
            enum:
                - TYPE_UNSPECIFIED
                - TYPE_MENU
                - TYPE_API
            type: string
        v1AddGroupsToUserResponse:
            properties:
                user:
                    $ref: '#/components/schemas/v1User'
            type: object
        v1CreateUserRequest:
            properties:
                email:
                    type: string
                groupIds:
                    items:
                        type: string
                    type: array
                password:
                    type: string
                username:
                    type: string
            type: object
        v1CreateUserResponse:
            properties:
                user:
                    $ref: '#/components/schemas/v1User'
            type: object
        v1DeleteUserResponse:
            type: object
        v1GetMeMenusResponse:
            properties:
                menus:
                    items:
                        $ref: '#/components/schemas/v1Menu'
                    type: array
            type: object
        v1GetMeResponse:
            properties:
                groups:
                    items:
                        $ref: '#/components/schemas/v1Group'
                    type: array
                user:
                    $ref: '#/components/schemas/v1User'
            type: object
        v1GetUserResponse:
            properties:
                user:
                    $ref: '#/components/schemas/v1User'
            type: object
        v1Group:
            properties:
                createdAt:
                    format: date-time
                    type: string
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                roles:
                    items:
                        $ref: '#/components/schemas/v1RoleGrant'
                    type: array
                status:
                    $ref: '#/components/schemas/v1GroupStatus'
                updatedAt:
                    format: date-time
                    type: string
            type: object
        v1GroupMembership:
            description: GroupMembership is one group the user is in, and when they leave it.
            properties:
                expiresAt:
                    description: When the membership lapses, unset when it does not.
                    format: date-time
                    type: string
                groupId:
                    type: string
            type: object
        v1GroupStatus:
            default: STATUS_UNSPECIFIED
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_ACTIVE
                - STATUS_INACTIVE
            type: string
        v1ListUserResponse:
            properties:
                total:
                    format: int64
                    type: string
                users:
                    items:
                        $ref: '#/components/schemas/v1User'
                    type: array
            type: object
        v1Menu:
            properties:
                authCode:
                    type: string
                children:
                    items:
                        $ref: '#/components/schemas/v1Menu'
                    type: array
                component:
                    type: string
                identifier:
                    type: string
                meta:
                    $ref: '#/components/schemas/v1MenuMeta'
                name:
                    type: string
                path:
                    type: string
                type:
                    $ref: '#/components/schemas/resourceV1Type'
            type: object
        v1MenuMeta:
            properties:
                authority:
                    type: string
                badge:
                    type: string
                hideInMenu:
                    type: boolean
                icon:
                    type: string
                keepAlive:
                    type: boolean
                order:
                    format: int64
                    type: integer
                title:
                    type: string
            type: object
        v1RemoveGroupsFromUserResponse:
            properties:
                user:
                    $ref: '#/components/schemas/v1User'
            type: object
        v1RoleGrant:
            description: RoleGrant is one role the group holds, and when it stops holding it.
            properties:
                expiresAt:
                    description: |-
                        When the grant lapses, unset when it does not. A grant that ends on Friday
                        and one that never ends are different things and must not read the same.
                    format: date-time
                    type: string
                roleId:
                    type: string
            type: object
        v1SendMeVerifyEmailRequest:
            description: |-
                The verification email is always sent to the authenticated user, so the
                request carries no target: taking a user id here would let a caller trigger
                mail to someone else's address.
            type: object
        v1SendMeVerifyEmailResponse:
            type: object
        v1UpdateMeRequest:
            properties:
                email:
                    type: string
                password:
                    type: string
                username:
                    type: string
            type: object
        v1UpdateMeResponse:
            properties:
                groups:
                    items:
                        $ref: '#/components/schemas/v1Group'
                    type: array
                user:
                    $ref: '#/components/schemas/v1User'
            type: object
        v1UpdateUserResponse:
            properties:
                user:
                    $ref: '#/components/schemas/v1User'
            type: object
        v1User:
            properties:
                createdAt:
                    format: date-time
                    type: string
                email:
                    type: string
                groups:
                    items:
                        $ref: '#/components/schemas/v1GroupMembership'
                    type: array
                id:
                    type: string
                status:
                    $ref: '#/components/schemas/v1UserStatus'
                updatedAt:
                    format: date-time
                    type: string
                username:
                    type: string
            type: object
        v1UserStatus:
            default: STATUS_UNSPECIFIED
            enum:
                - STATUS_UNSPECIFIED
                - STATUS_ACTIVE
                - STATUS_INACTIVE
            type: string
info:
    title: user/v1/service.proto
    version: version not set
openapi: 3.0.3
paths:
    /api/v1/me:
        get:
            operationId: UserService_GetMe
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1GetMeResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
        put:
            operationId: UserService_UpdateMe
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1UpdateMeRequest'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1UpdateMeResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
    /api/v1/me/menus:
        get:
            operationId: UserService_GetMeMenus
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1GetMeMenusResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
    /api/v1/me/verify-email:
        post:
            operationId: UserService_SendMeVerifyEmail
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1SendMeVerifyEmailRequest'
                description: |-
                    The verification email is always sent to the authenticated user, so the
                    request carries no target: taking a user id here would let a caller trigger
                    mail to someone else's address.
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1SendMeVerifyEmailResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
    /api/v1/users:
        get:
            operationId: UserService_ListUser
            parameters:
                - in: query
                  name: limit
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: offset
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: userIds
                  schema:
                    items:
                        type: string
                    type: array
                - in: query
                  name: userEmails
                  schema:
                    items:
                        type: string
                    type: array
                - in: query
                  name: userName
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    default: STATUS_UNSPECIFIED
                    enum:
                        - STATUS_UNSPECIFIED
                        - STATUS_ACTIVE
                        - STATUS_INACTIVE
                    type: string
                - in: query
                  name: groupIds
                  schema:
                    items:
                        type: string
                    type: array
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1ListUserResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
        post:
            operationId: UserService_CreateUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1CreateUserRequest'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1CreateUserResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
    /api/v1/users/{id}:
        delete:
            operationId: UserService_DeleteUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1DeleteUserResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
        get:
            operationId: UserService_GetUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1GetUserResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
        put:
            operationId: UserService_UpdateUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserServiceUpdateUserBody'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1UpdateUserResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
    /api/v1/users/{id}/groups/add:
        post:
            operationId: UserService_AddGroupsToUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserServiceAddGroupsToUserBody'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1AddGroupsToUserResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
    /api/v1/users/{id}/groups/remove:
        post:
            operationId: UserService_RemoveGroupsFromUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserServiceRemoveGroupsFromUserBody'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1RemoveGroupsFromUserResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/googleRpcStatus'
                    description: An unexpected error response.
            tags:
                - UserService
tags:
    - name: UserService
