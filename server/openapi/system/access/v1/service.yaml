components:
    schemas:
        AccessRequestServiceCancelAccessRequestBody:
            type: object
        AccessRequestServiceDecideAccessRequestBody:
            properties:
                approved:
                    description: |-
                        True performs the grant; false records the refusal. There is no third
                        state: a request is decided once.
                    type: boolean
                comment:
                    type: string
            type: object
        protobufAny:
            additionalProperties: {}
            properties:
                '@type':
                    type: string
            type: object
        rpcStatus:
            properties:
                code:
                    format: int32
                    type: integer
                details:
                    items:
                        $ref: '#/components/schemas/protobufAny'
                    type: array
                message:
                    type: string
            type: object
        v1AccessPath:
            description: |-
                AccessPath is one route by which a user is allowed an operation: the group
                they belong to, the role that group holds, and the permission that role
                grants.

                A user often holds the same access by more than one route. Every route is
                reported rather than the first one found, because revoking one of three is
                not a revocation, and noticing that is the reason to ask.
            properties:
                action:
                    type: string
                expiresAt:
                    description: |-
                        When this route lapses, unset when no edge of it expires. It is the
                        earliest expiry along the route: the access ends when the first of the
                        memberships and grants behind it does.
                    format: date-time
                    type: string
                groupId:
                    type: string
                groupName:
                    type: string
                permissionId:
                    type: string
                resource:
                    description: |-
                        The resource identifier and verb the permission itself names, patterns
                        included: a route granted through `api.*` reports `api.*`, not the
                        operation that was asked about. A wildcard grant is the thing most worth
                        seeing here, so it is not resolved away.
                    type: string
                roleId:
                    type: string
                roleName:
                    type: string
            type: object
        v1AccessRequest:
            description: |-
                AccessRequest is one person asking for another to be put in a group, and
                somebody else agreeing.

                requester and subject are separate because the interesting requests are made
                on somebody else's behalf: a manager for a report, the assistant for whoever
                it is answering.
            properties:
                createdAt:
                    format: date-time
                    type: string
                decidedAt:
                    format: date-time
                    type: string
                decidedByUserId:
                    type: string
                decisionComment:
                    type: string
                groupId:
                    type: string
                id:
                    type: string
                origin:
                    $ref: '#/components/schemas/v1RequestOrigin'
                reason:
                    type: string
                requestedUntil:
                    description: |-
                        The term asked for, unset for "permanently". On approval it becomes the
                        membership's expiry, so a request for a week grants a week.
                    format: date-time
                    type: string
                requesterUserId:
                    type: string
                sessionId:
                    description: |-
                        The chat session the assistant raised this in. Empty for every other
                        origin.
                    type: string
                status:
                    $ref: '#/components/schemas/v1RequestStatus'
                subjectUserId:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            type: object
        v1CancelAccessRequestResponse:
            properties:
                accessRequest:
                    $ref: '#/components/schemas/v1AccessRequest'
            type: object
        v1CreateAccessRequestRequest:
            properties:
                groupId:
                    type: string
                reason:
                    description: |-
                        Why. Required, because a request nobody explained is a request nobody can
                        judge.
                    type: string
                requestedUntil:
                    description: |-
                        How long for. Leave it unset to ask permanently, which is a bigger ask and
                        reads as one on the approval screen.
                    format: date-time
                    type: string
                subjectUserId:
                    description: Who the access is for. Leave it unset to ask for yourself.
                    type: string
            type: object
        v1CreateAccessRequestResponse:
            properties:
                accessRequest:
                    $ref: '#/components/schemas/v1AccessRequest'
            type: object
        v1DecideAccessRequestResponse:
            properties:
                accessRequest:
                    $ref: '#/components/schemas/v1AccessRequest'
            type: object
        v1ExplainUserAccessResponse:
            properties:
                allowed:
                    description: |-
                        Allowed is the answer the authorization interceptor would give the same
                        question. It is exactly `paths` being non-empty, carried explicitly so a
                        caller reading only this field cannot misread an empty list.
                    type: boolean
                paths:
                    items:
                        $ref: '#/components/schemas/v1AccessPath'
                    type: array
            type: object
        v1ListAccessRequestsResponse:
            properties:
                accessRequests:
                    items:
                        $ref: '#/components/schemas/v1AccessRequest'
                    type: array
                total:
                    format: int64
                    type: string
            type: object
        v1ListPrincipalsForOperationResponse:
            properties:
                principals:
                    items:
                        $ref: '#/components/schemas/v1Principal'
                    type: array
            type: object
        v1Principal:
            description: Principal is a user allowed an operation, with every route that allows it.
            properties:
                paths:
                    items:
                        $ref: '#/components/schemas/v1AccessPath'
                    type: array
                userId:
                    type: string
                username:
                    type: string
            type: object
        v1RequestOrigin:
            default: REQUEST_ORIGIN_UNSPECIFIED
            description: RequestOrigin is the surface a request came in by.
            enum:
                - REQUEST_ORIGIN_UNSPECIFIED
                - REQUEST_ORIGIN_CONSOLE
                - REQUEST_ORIGIN_CLI
                - REQUEST_ORIGIN_AI_CHAT
            type: string
        v1RequestStatus:
            default: REQUEST_STATUS_UNSPECIFIED
            description: |-
                RequestStatus is where an access request has got to. A request is decided
                once; there is no route back to pending.

                The per-value comments this would normally carry are left out on purpose: the
                OpenAPI generator renders them into a description that the web client's
                schema generator cannot parse.
            enum:
                - REQUEST_STATUS_UNSPECIFIED
                - REQUEST_STATUS_PENDING
                - REQUEST_STATUS_APPROVED
                - REQUEST_STATUS_REJECTED
                - REQUEST_STATUS_CANCELLED
            type: string
info:
    title: system/access/v1/service.proto
    version: version not set
openapi: 3.0.3
paths:
    /api/v1/access-requests:
        get:
            operationId: AccessRequestService_ListAccessRequests
            parameters:
                - in: query
                  name: limit
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: offset
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: requesterUserId
                  schema:
                    type: string
                - in: query
                  name: subjectUserId
                  schema:
                    type: string
                - in: query
                  name: groupId
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    default: REQUEST_STATUS_UNSPECIFIED
                    enum:
                        - REQUEST_STATUS_UNSPECIFIED
                        - REQUEST_STATUS_PENDING
                        - REQUEST_STATUS_APPROVED
                        - REQUEST_STATUS_REJECTED
                        - REQUEST_STATUS_CANCELLED
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1ListAccessRequestsResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            tags:
                - AccessRequestService
        post:
            operationId: AccessRequestService_CreateAccessRequest
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/v1CreateAccessRequestRequest'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1CreateAccessRequestResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            tags:
                - AccessRequestService
    /api/v1/access-requests/{id}/cancel:
        post:
            operationId: AccessRequestService_CancelAccessRequest
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccessRequestServiceCancelAccessRequestBody'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1CancelAccessRequestResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            tags:
                - AccessRequestService
    /api/v1/access-requests/{id}/decide:
        post:
            operationId: AccessRequestService_DecideAccessRequest
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccessRequestServiceDecideAccessRequestBody'
                required: true
                x-originalParamName: body
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1DecideAccessRequestResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            tags:
                - AccessRequestService
    /api/v1/access/explain:
        get:
            operationId: AccessService_ExplainUserAccess
            parameters:
                - in: query
                  name: userId
                  schema:
                    type: string
                - description: |-
                    The resource and verb as the server enforces them - `api.user.v1.UserService`
                    and `ListUser` - not a REST path. `hub api describe <rpc>` prints the pair
                    for any operation.
                  in: query
                  name: resource
                  schema:
                    type: string
                - in: query
                  name: action
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1ExplainUserAccessResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            tags:
                - AccessService
    /api/v1/access/principals:
        get:
            operationId: AccessService_ListPrincipalsForOperation
            parameters:
                - in: query
                  name: resource
                  schema:
                    type: string
                - in: query
                  name: action
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/v1ListPrincipalsForOperationResponse'
                    description: A successful response.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/rpcStatus'
                    description: An unexpected error response.
            tags:
                - AccessService
tags:
    - name: AccessService
    - name: AccessRequestService
