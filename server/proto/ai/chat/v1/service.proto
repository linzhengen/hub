syntax = "proto3";

package ai.chat.v1;

import "ai/chat/v1/model.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "hub/annotations/v1/annotations.proto";

option go_package = "github.com/linzhengen/hub/pb/ai/chat/v1";

service ChatService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {
      post: "/api/v1/chat/sessions"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Create a new chat session for the authenticated user."};
  }
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/api/v1/chat/sessions"};
    option (hub.annotations.v1.method_rule) = {summary: "List chat sessions belonging to the authenticated user."};
  }
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {
    option (google.api.http) = {delete: "/api/v1/chat/sessions/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Delete a chat session and all its messages."};
  }
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse) {
    option (google.api.http) = {
      post: "/api/v1/chat/sessions/{id}/messages"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Send a message and stream the assistant response."};
  }
  rpc ConfirmToolCall(ConfirmToolCallRequest) returns (stream ConfirmToolCallResponse) {
    option (google.api.http) = {
      post: "/api/v1/chat/proposals/{id}/confirm"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Approve or decline a change the assistant proposed, and stream the rest of the answer."};
  }
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option (google.api.http) = {get: "/api/v1/chat/sessions/{id}/messages"};
    option (hub.annotations.v1.method_rule) = {summary: "List messages in a chat session."};
  }
}

message CreateSessionRequest {
  string title = 1 [(buf.validate.field).string.max_len = 255];
}

message CreateSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message DeleteSessionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteSessionResponse {}

message SendMessageRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string content = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 8192
  }];
}

message SendMessageResponse {
  string delta = 1;
  bool done = 2;
  Message message = 3;
  // ToolCall is set instead of delta on the frames that report a lookup.
  ToolCall tool_call = 4;
  // ToolProposal is set on the frame that stops the answer to ask permission
  // for a change. It is the last frame of the stream; answer it with
  // ConfirmToolCall.
  ToolProposal tool_proposal = 5;
}

message ConfirmToolCallRequest {
  // The proposal being answered.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // True runs the proposed change; false declines it and lets the assistant
  // answer around it. There is no third state: a proposal is answered once.
  bool approved = 2;
}

// ConfirmToolCallResponse is the same frame as SendMessageResponse - the answer
// carries on where it stopped, and may stop again on a further change.
message ConfirmToolCallResponse {
  string delta = 1;
  bool done = 2;
  Message message = 3;
  ToolCall tool_call = 4;
  ToolProposal tool_proposal = 5;
}

message ListMessagesRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ListMessagesResponse {
  repeated Message messages = 1;
}
