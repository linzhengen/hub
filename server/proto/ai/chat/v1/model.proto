syntax = "proto3";

package ai.chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/linzhengen/hub/pb/ai/chat/v1";

message Session {
  string id = 1;
  string user_id = 2;
  string title = 3;
  google.protobuf.Timestamp created_at = 4;
}

message Message {
  string id = 1;
  string session_id = 2;
  string role = 3;
  string content = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ToolCall reports that the assistant looked something up while answering, so
// the client can say what it is doing rather than sit silent through a pause.
//
// It carries what was asked, not what came back: the arguments explain the
// pause ("looking up the admin group") while a result would put data on screen
// that the answer itself is about to summarise anyway.
message ToolCall {
  // Name is the tool the assistant called, e.g. "list_user".
  string name = 1;
  // Arguments is the JSON object the assistant passed, as it supplied it.
  string arguments = 2;
}

// ToolProposal is a change the assistant wants to make and has not made.
//
// The stream that carries one ends with it: the change happens only if the
// user answers ConfirmToolCall with approved = true, and until then nothing has
// been written.
//
// name and arguments are the real operation and the real arguments rather than
// a summary of them. "Add three users to a group" is not something a person can
// meaningfully agree to; the operation and the ids are.
message ToolProposal {
  string id = 1;
  // Name is the tool the assistant proposes to run, e.g. "add_users_to_group".
  string name = 2;
  // Arguments is the JSON object it proposes to pass, as it supplied it.
  string arguments = 3;
}
