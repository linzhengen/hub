syntax = "proto3";

package system.permission.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "hub/annotations/v1/annotations.proto";
import "system/permission/v1/model.proto";

option go_package = "github.com/linzhengen/hub/v1/server/pb/system/permission/v1";

service PermissionService {
  rpc GetPermission(GetPermissionRequest) returns (GetPermissionResponse) {
    option (google.api.http) = {get: "/api/v1/permissions/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Get a single permission by id."};
  }
  rpc ListPermission(ListPermissionRequest) returns (ListPermissionResponse) {
    option (google.api.http) = {get: "/api/v1/permissions"};
    option (hub.annotations.v1.method_rule) = {summary: "List permissions, optionally filtered by id or name."};
  }
  rpc CreatePermission(CreatePermissionRequest) returns (CreatePermissionResponse) {
    option (google.api.http) = {
      post: "/api/v1/permissions"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Create a permission binding a verb to a resource."};
  }
  rpc UpdatePermission(UpdatePermissionRequest) returns (UpdatePermissionResponse) {
    option (google.api.http) = {
      put: "/api/v1/permissions/{id}"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Update a permission's verb or description."};
  }
  rpc DeletePermission(DeletePermissionRequest) returns (DeletePermissionResponse) {
    option (google.api.http) = {delete: "/api/v1/permissions/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Delete a permission."};
  }
}

message GetPermissionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetPermissionResponse {
  Permission permission = 1;
}

message ListPermissionRequest {
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 200];
  uint32 offset = 2;
  repeated string permission_ids = 3 [(buf.validate.field).repeated.items.string.uuid = true];
  string permission_name = 4 [(buf.validate.field).string.max_len = 64];
}

message ListPermissionResponse {
  repeated Permission permissions = 1;
  int64 total = 2;
}

message CreatePermissionRequest {
  string resource_id = 2 [(buf.validate.field).string.uuid = true];
  string verb = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string description = 4 [(buf.validate.field).string.max_len = 255];
}

message CreatePermissionResponse {
  Permission permission = 1;
}

message UpdatePermissionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string verb = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string description = 3 [(buf.validate.field).string.max_len = 255];
}

message UpdatePermissionResponse {
  Permission permission = 1;
}

message DeletePermissionRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeletePermissionResponse {}
