syntax = "proto3";

package system.access.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "hub/annotations/v1/annotations.proto";
import "system/access/v1/model.proto";

option go_package = "github.com/linzhengen/hub/server/pb/system/access/v1";

// AccessService reads the authorization graph the other system services edit,
// and answers questions about it that a list of users, groups and roles cannot:
// why somebody is allowed something, and who else is.
//
// It reaches the same decision the authorization interceptor does, through the
// same pattern matching, and reports the reasons behind it. Nothing here
// changes a permission.
service AccessService {
  rpc ExplainUserAccess(ExplainUserAccessRequest) returns (ExplainUserAccessResponse) {
    option (google.api.http) = {get: "/api/v1/access/explain"};
    option (hub.annotations.v1.method_rule) = {summary: "Explain whether a user is allowed an operation, listing every route that allows it."};
  }
  rpc ListPrincipalsForOperation(ListPrincipalsForOperationRequest) returns (ListPrincipalsForOperationResponse) {
    option (google.api.http) = {get: "/api/v1/access/principals"};
    option (hub.annotations.v1.method_rule) = {summary: "List the users allowed an operation, with the routes that allow it."};
  }
}

message ExplainUserAccessRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  // The resource and verb as the server enforces them - `api.user.v1.UserService`
  // and `ListUser` - not a REST path. `hub api describe <rpc>` prints the pair
  // for any operation.
  string resource = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string action = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message ExplainUserAccessResponse {
  // Allowed is the answer the authorization interceptor would give the same
  // question. It is exactly `paths` being non-empty, carried explicitly so a
  // caller reading only this field cannot misread an empty list.
  bool allowed = 1;
  repeated AccessPath paths = 2;
}

message ListPrincipalsForOperationRequest {
  string resource = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string action = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message ListPrincipalsForOperationResponse {
  repeated Principal principals = 1;
}

// AccessRequestService is the way into a group that does not require being able
// to grant it yourself: ask, and have somebody else agree.
//
// The decision is deliberately a separate rpc from the request, guarded by its
// own permission, and refused when the decider is the person who asked. That
// split is what lets a request be raised from anywhere - including by the
// assistant, on behalf of the user it is answering - while the change itself
// still waits on a person who is not the one asking for it.
service AccessRequestService {
  rpc CreateAccessRequest(CreateAccessRequestRequest) returns (CreateAccessRequestResponse) {
    option (google.api.http) = {
      post: "/api/v1/access-requests"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {
      // Anyone signed in may ask. Asking grants nothing, and a queue of
      // requests nobody may raise is a queue nobody uses.
      public: true
      summary: "Ask for a user to be put in a group, giving a reason and how long for."
    };
  }
  rpc ListAccessRequests(ListAccessRequestsRequest) returns (ListAccessRequestsResponse) {
    option (google.api.http) = {get: "/api/v1/access-requests"};
    option (hub.annotations.v1.method_rule) = {summary: "List access requests, optionally filtered by requester, subject, group or status."};
  }
  rpc CancelAccessRequest(CancelAccessRequestRequest) returns (CancelAccessRequestResponse) {
    option (google.api.http) = {
      post: "/api/v1/access-requests/{id}/cancel"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {
      // Withdrawing your own ask needs no permission; the use case refuses
      // anyone who is not the requester.
      public: true
      summary: "Withdraw a request you raised, while it is still pending."
    };
  }
  rpc DecideAccessRequest(DecideAccessRequestRequest) returns (DecideAccessRequestResponse) {
    option (google.api.http) = {
      post: "/api/v1/access-requests/{id}/decide"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Approve or reject a request. Approving performs the grant, for the term asked for."};
  }
}

message CreateAccessRequestRequest {
  // Who the access is for. Leave it unset to ask for yourself.
  optional string subject_user_id = 1 [(buf.validate.field).string.uuid = true];
  string group_id = 2 [(buf.validate.field).string.uuid = true];
  // Why. Required, because a request nobody explained is a request nobody can
  // judge.
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  // How long for. Leave it unset to ask permanently, which is a bigger ask and
  // reads as one on the approval screen.
  optional google.protobuf.Timestamp requested_until = 4 [(buf.validate.field).timestamp.gt_now = true];
}

message CreateAccessRequestResponse {
  AccessRequest access_request = 1;
}

message ListAccessRequestsRequest {
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 200];
  uint32 offset = 2;
  optional string requester_user_id = 3 [(buf.validate.field).string.uuid = true];
  optional string subject_user_id = 4 [(buf.validate.field).string.uuid = true];
  optional string group_id = 5 [(buf.validate.field).string.uuid = true];
  RequestStatus status = 6;
}

message ListAccessRequestsResponse {
  repeated AccessRequest access_requests = 1;
  int64 total = 2;
}

message CancelAccessRequestRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message CancelAccessRequestResponse {
  AccessRequest access_request = 1;
}

message DecideAccessRequestRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // True performs the grant; false records the refusal. There is no third
  // state: a request is decided once.
  bool approved = 2;
  string comment = 3 [(buf.validate.field).string.max_len = 1024];
}

message DecideAccessRequestResponse {
  AccessRequest access_request = 1;
}
