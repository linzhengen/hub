syntax = "proto3";

package system.group.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "hub/annotations/v1/annotations.proto";
import "system/group/v1/model.proto";

option go_package = "github.com/linzhengen/hub/server/pb/system/group/v1";

service GroupService {
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse) {
    option (google.api.http) = {get: "/api/v1/groups/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Get a single group by id."};
  }
  rpc ListGroup(ListGroupRequest) returns (ListGroupResponse) {
    option (google.api.http) = {get: "/api/v1/groups"};
    option (hub.annotations.v1.method_rule) = {summary: "List groups, optionally filtered by id, name, status or role."};
  }
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/groups"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Create a group."};
  }
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {
    option (google.api.http) = {
      put: "/api/v1/groups/{id}"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Update a group's name, status or description."};
  }
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {
    option (google.api.http) = {delete: "/api/v1/groups/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Delete a group."};
  }
  rpc AddRolesToGroup(AddRolesToGroupRequest) returns (AddRolesToGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/groups/{id}/roles/add"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Grant roles to a group, keeping the roles it already has."};
  }
  rpc RemoveRolesFromGroup(RemoveRolesFromGroupRequest) returns (RemoveRolesFromGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/groups/{id}/roles/remove"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Revoke roles from a group."};
  }
  rpc AddUsersToGroup(AddUsersToGroupRequest) returns (AddUsersToGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/groups/{id}/users/add"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Add users to a group, keeping the existing members."};
  }
  rpc RemoveUsersFromGroup(RemoveUsersFromGroupRequest) returns (RemoveUsersFromGroupResponse) {
    option (google.api.http) = {
      post: "/api/v1/groups/{id}/users/remove"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Remove users from a group."};
  }
}

message GetGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetGroupResponse {
  Group group = 1;
}

message ListGroupRequest {
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 200];
  uint32 offset = 2;
  repeated string group_ids = 3 [(buf.validate.field).repeated.items.string.uuid = true];
  string group_name = 4 [(buf.validate.field).string.max_len = 64];
  Group.Status status = 5;
  repeated string role_ids = 6 [(buf.validate.field).repeated.items.string.uuid = true];
}

message ListGroupResponse {
  repeated Group groups = 1;
  int64 total = 2;
}

message CreateGroupRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  Group.Status status = 2;
  string description = 3 [(buf.validate.field).string.max_len = 255];
}

message CreateGroupResponse {
  Group group = 1;
}

message UpdateGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  Group.Status status = 3;
  string description = 4 [(buf.validate.field).string.max_len = 255];
}

message UpdateGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteGroupResponse {}

message AddRolesToGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string role_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {uuid: true}
    }
  }];
  // When the grant lapses. Leave it unset to grant for good, which is what
  // every grant made before this field existed did.
  //
  // It applies to each id in this request, since one call is one decision:
  // "give them these three until Friday". A grant with a different term is a
  // different decision, so it is a different call.
  optional google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).timestamp.gt_now = true];
}

message AddRolesToGroupResponse {
  Group group = 1;
}

message RemoveRolesFromGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string role_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {uuid: true}
    }
  }];
}

message RemoveRolesFromGroupResponse {
  Group group = 1;
}

message AddUsersToGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string user_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {uuid: true}
    }
  }];
  // When the grant lapses. Leave it unset to grant for good, which is what
  // every grant made before this field existed did.
  //
  // It applies to each id in this request, since one call is one decision:
  // "give them these three until Friday". A grant with a different term is a
  // different decision, so it is a different call.
  optional google.protobuf.Timestamp expires_at = 3 [(buf.validate.field).timestamp.gt_now = true];
}

message AddUsersToGroupResponse {
  Group group = 1;
}

message RemoveUsersFromGroupRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string user_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {uuid: true}
    }
  }];
}

message RemoveUsersFromGroupResponse {
  Group group = 1;
}
