syntax = "proto3";

package system.role.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "hub/annotations/v1/annotations.proto";
import "system/role/v1/model.proto";

option go_package = "github.com/linzhengen/hub/v1/server/pb/system/role/v1";

service RoleService {
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {get: "/api/v1/roles/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Get a single role by id."};
  }
  rpc ListRole(ListRoleRequest) returns (ListRoleResponse) {
    option (google.api.http) = {get: "/api/v1/roles"};
    option (hub.annotations.v1.method_rule) = {summary: "List roles, optionally filtered by id, name or permission."};
  }
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/roles"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Create a role."};
  }
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/api/v1/roles/{id}"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Update a role's name or description."};
  }
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/api/v1/roles/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Delete a role."};
  }
  rpc AddPermissionsToRole(AddPermissionsToRoleRequest) returns (AddPermissionsToRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/roles/{id}/permissions/add"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Grant permissions to a role, keeping the ones it already has."};
  }
  rpc RemovePermissionsFromRole(RemovePermissionsFromRoleRequest) returns (RemovePermissionsFromRoleResponse) {
    option (google.api.http) = {
      post: "/api/v1/roles/{id}/permissions/remove"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Revoke permissions from a role."};
  }
}

message GetRoleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetRoleResponse {
  Role role = 1;
}

message ListRoleRequest {
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 200];
  uint32 offset = 2;
  repeated string role_ids = 3 [(buf.validate.field).repeated.items.string.uuid = true];
  string role_name = 4 [(buf.validate.field).string.max_len = 64];
  repeated string permission_ids = 5 [(buf.validate.field).repeated.items.string.uuid = true];
}

message ListRoleResponse {
  repeated Role roles = 1;
  int64 total = 2;
}

message CreateRoleRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string description = 2 [(buf.validate.field).string.max_len = 255];
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string description = 3 [(buf.validate.field).string.max_len = 255];
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteRoleResponse {}

message AddPermissionsToRoleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string permission_ids = 2 [(buf.validate.field).repeated = {min_items: 1, items {string {uuid: true}}}];
}

message AddPermissionsToRoleResponse {
  Role role = 1;
}

message RemovePermissionsFromRoleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated string permission_ids = 2 [(buf.validate.field).repeated = {min_items: 1, items {string {uuid: true}}}];
}

message RemovePermissionsFromRoleResponse {
  Role role = 1;
}
