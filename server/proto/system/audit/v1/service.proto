syntax = "proto3";

package system.audit.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "hub/annotations/v1/annotations.proto";
import "system/audit/v1/model.proto";

option go_package = "github.com/linzhengen/hub/server/pb/system/audit/v1";

// AuditService reads the record of changes to the authorization graph. It has
// no write rpc: records are written by the server as changes are made, and one
// that could be edited afterwards would prove nothing.
service AuditService {
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse) {
    option (google.api.http) = {get: "/api/v1/audit-logs"};
    option (hub.annotations.v1.method_rule) = {summary: "List recorded changes to users, groups, roles, permissions and resources, newest first."};
  }
}

message ListAuditLogRequest {
  uint32 limit = 1 [(buf.validate.field).uint32.lte = 200];
  uint32 offset = 2;
  // The person responsible for the change. Optional so that the uuid rule is
  // skipped when the filter is not used, rather than rejecting every unfiltered
  // listing.
  optional string actor_user_id = 3 [(buf.validate.field).string.uuid = true];
  // The RBAC resource, e.g. "api.system.group.v1.GroupService".
  string resource = 4 [(buf.validate.field).string.max_len = 255];
  // The rpc name, e.g. "AddRolesToGroup".
  string action = 5 [(buf.validate.field).string.max_len = 64];
  // The entity that was changed.
  string target_id = 6 [(buf.validate.field).string.max_len = 255];
  Channel channel = 7;
  // Bounds on when the change was recorded. Either may be left unset.
  google.protobuf.Timestamp since = 8;
  google.protobuf.Timestamp until = 9;
}

message ListAuditLogResponse {
  repeated AuditLog audit_logs = 1;
  int64 total = 2;
}
