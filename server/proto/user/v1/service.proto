syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "hub/annotations/v1/annotations.proto";
import "system/group/v1/model.proto";
import "user/v1/model.proto";

option go_package = "github.com/linzhengen/hub/v1/server/pb/user/v1";

service UserService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {get: "/api/v1/me"};
    // Every authenticated caller must be able to read their own profile,
    // otherwise a user with no roles yet could not load the app at all.
    option (hub.annotations.v1.method_rule) = {
      public: true
      summary: "Get the profile and groups of the authenticated user."
    };
  }
  rpc GetMeMenus(GetMeMenusRequest) returns (GetMeMenusResponse) {
    option (google.api.http) = {get: "/api/v1/me/menus"};
    option (hub.annotations.v1.method_rule) = {summary: "List the menu tree the authenticated user is allowed to see."};
  }
  rpc UpdateMe(UpdateMeRequest) returns (UpdateMeResponse) {
    option (google.api.http) = {
      put: "/api/v1/me"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Update the authenticated user's own username, email or password."};
  }
  rpc SendMeVerifyEmail(SendMeVerifyEmailRequest) returns (SendMeVerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/me/verify-email"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Send a verification email to the authenticated user's address."};
  }
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/api/v1/users/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Get a single user by id."};
  }
  rpc ListUser(ListUserRequest) returns (ListUserResponse) {
    option (google.api.http) = {get: "/api/v1/users"};
    option (hub.annotations.v1.method_rule) = {summary: "List users, optionally filtered by id, email, name, status or group."};
  }
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put: "/api/v1/users/{id}"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Update a user's username, email, status, password or group membership."};
  }
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {delete: "/api/v1/users/{id}"};
    option (hub.annotations.v1.method_rule) = {summary: "Delete a user."};
  }
  rpc AddGroupsToUser(AddGroupsToUserRequest) returns (AddGroupsToUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/groups/add"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Add a user to groups, keeping the groups they are already in."};
  }
  rpc RemoveGroupsFromUser(RemoveGroupsFromUserRequest) returns (RemoveGroupsFromUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users/{id}/groups/remove"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Remove a user from groups."};
  }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/users"
      body: "*"
    };
    option (hub.annotations.v1.method_rule) = {summary: "Create a user and optionally place them in groups."};
  }
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  repeated string group_ids = 5;
}

message CreateUserResponse {
  User user = 1;
}

message GetMeRequest {}

message GetMeResponse {
  user.v1.User user = 1;
  repeated system.group.v1.Group groups = 2;
}

message GetMeMenusRequest {}

message GetMeMenusResponse {
  repeated Menu menus = 1;
}

message UpdateMeRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message UpdateMeResponse {
  user.v1.User user = 1;
  repeated system.group.v1.Group groups = 2;
}

// The verification email is always sent to the authenticated user, so the
// request carries no target: taking a user id here would let a caller trigger
// mail to someone else's address.
message SendMeVerifyEmailRequest {}

message SendMeVerifyEmailResponse {}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ListUserRequest {
  uint32 limit = 1;
  uint32 offset = 2;
  repeated string user_ids = 3;
  repeated string user_emails = 4;
  string user_name = 5;
  User.Status status = 6;
  repeated string group_ids = 7;
}

message ListUserResponse {
  repeated User users = 1;
  int64 total = 2;
}

message UpdateUserRequest {
  string id = 1;
  string username = 2;
  string email = 3;
  User.Status status = 4;
  optional string password = 5;
  repeated string group_ids = 6;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

message AddGroupsToUserRequest {
  string id = 1;
  repeated string group_ids = 2;
}

message AddGroupsToUserResponse {
  User user = 1;
}

message RemoveGroupsFromUserRequest {
  string id = 1;
  repeated string group_ids = 2;
}

message RemoveGroupsFromUserResponse {
  User user = 1;
}
