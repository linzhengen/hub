# DEV/MINIKUBE ONLY. This base targets the disposable dev and minikube
# overlays; it is not hardened for a shared or production-like cluster.
# See "Environment Scope" in infra/k8s/AGENTS.md before reusing it elsewhere.
global:
  security:
    # The Bitnami chart refuses non-Bitnami images unless this is set. The image
    # below is this project's own rebuild of the upstream PostgreSQL image, so
    # the check is bypassed knowingly.
    allowInsecureImages: true
image:
  registry: ghcr.io
  repository: linzhengen/postgresql
  tag: 18.3.0-debian-12-r13
auth:
  existingSecret: "postgres-secret"
  database: "hub"
  usePasswordFiles: false
  secretKeys:
    adminPasswordKey: "POSTGRES_PASSWORD"
primary:
  persistence:
    # DEV/MINIKUBE ONLY: the database is intentionally ephemeral so a cluster can
    # be torn down and recreated without leaving PVCs behind. Every Pod restart
    # or reschedule wipes all data, including the `keycloak` database created by
    # the initdb script below and any realm/user data Keycloak stored in it —
    # the initdb scripts then re-run from scratch on the empty volume.
    # A non-dev overlay MUST enable persistence (and set a storageClass/size).
    enabled: false
  networkPolicy:
    # The chart enables a NetworkPolicy by default, but with allowExternal:true
    # it accepts connections to 5432 from any source. Restrict it to the two
    # namespaces that actually need the DB (hub and keycloak); extraIngress is
    # used because ingressNSMatchLabels is a single label map and cannot express
    # "either of these two namespaces".
    allowExternal: false
    allowExternalEgress: false
    extraIngress:
      - ports:
          - port: 5432
        from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: hub
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: keycloak
  initdb:
    scripts:
      create-keycloak-db.sql: |
        CREATE DATABASE keycloak;
        GRANT ALL PRIVILEGES ON DATABASE keycloak TO postgres;
