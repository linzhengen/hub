# DEV/MINIKUBE ONLY. This base targets the disposable dev and minikube
# overlays; it is not hardened for a shared or production-like cluster.
# See "Environment Scope" in infra/k8s/AGENTS.md before reusing it elsewhere.
global:
  security:
    # The Bitnami chart refuses non-Bitnami images unless this is set. The image
    # below is this project's own rebuild of the upstream Keycloak image
    # (bundled themes), so the check is bypassed knowingly.
    allowInsecureImages: true
image:
  registry: ghcr.io
  repository: linzhengen/keyclaok
  tag: 26.6.1-debian-12
auth:
  adminUser: admin
  existingSecret: "keycloak-secret"
  passwordSecretKey: "KEYCLOAK_ADMIN_PASSWORD"
networkPolicy:
  # allowExternal stays true: Keycloak must accept browser traffic for the OIDC
  # login/redirect flow, so its ingress cannot be limited to in-cluster sources.
  # Egress is tightened from "allow everything" to DNS + the external DB port +
  # inter-node ports (see the chart's networkpolicy.yaml). Because
  # postgresql.enabled is false here, the DB rule has no destination selector,
  # which is what lets Keycloak reach postgresql.postgresql:5432 cross-namespace.
  allowExternalEgress: false
postgresql:
  enabled: false
externalDatabase:
  host: postgresql
  port: 5432
  user: postgres
  existingSecret: "keycloak-secret"
  existingSecretPasswordKey: "POSTGRES_PASSWORD"
  database: keycloak
extraEnvVars:
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    value: admin
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secret
        key: KEYCLOAK_ADMIN_PASSWORD
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL
    value: jdbc:postgresql://postgresql.postgresql:5432/keycloak
  - name: KC_DB_USERNAME
    value: postgres
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-secret
        key: POSTGRES_PASSWORD
  # DEV/MINIKUBE ONLY: Keycloak is reached over plain HTTP through a port-forward
  # or a NodePort with no stable hostname, so hostname validation is off and the
  # HTTP listener is on. A non-dev overlay MUST override both: terminate TLS in
  # front of Keycloak, set KC_HOSTNAME to the public URL with
  # KC_HOSTNAME_STRICT: "true", and drop KC_HTTP_ENABLED so tokens and admin
  # credentials never travel unencrypted.
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HTTP_ENABLED
    value: "true"
extraVolumes:
  - name: theme-hub-login
    configMap:
      name: keycloak-theme-hub-login
  - name: theme-hub-login-resources-img
    configMap:
      name: keycloak-theme-hub-login-resources-img
extraVolumeMounts:
  - name: theme-hub-login
    mountPath: /opt/bitnami/keycloak/themes/hub/login
    readOnly: true
  - name: theme-hub-login-resources-img
    mountPath: /opt/bitnami/keycloak/themes/hub/login/resources/img
    readOnly: true
