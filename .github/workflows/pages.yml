name: Pages

# Publishes the documentation site in docs/ to GitHub Pages. The API explorer
# and the API reference are assembled from the artifacts `make gen` produces, so
# a proto change reaches the published docs with the commit that generates it.
#
# Requires Pages to be enabled for the repository with "Source: GitHub Actions"
# (Settings → Pages).

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'server/openapi/**'
      - '.agents/skills/hub-api/references/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'server/openapi/**'
      - '.agents/skills/hub-api/references/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    name: Deploy
    needs: build
    # Pull requests only prove the site still builds; nothing is published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
