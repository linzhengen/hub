# pnpm settings for ui/web. Created by pnpm when vite was pinned to a release
# newer than the default minimumReleaseAge window.
minimumReleaseAgeExclude:
  - vite@8.2.1

# esbuild's postinstall fetches its platform binary, so its build script has to
# run. CI already installs with --dangerously-allow-all-builds; this makes the
# same thing true for a plain local `pnpm install`.
allowBuilds:
  esbuild: true
  # msw comes in only as vitest's optional mocking backend and is never used
  # here. Its postinstall just copies a service worker into a public directory,
  # so there is nothing to run.
  msw: false

# esbuild reaches us through tsx, which still resolves an 0.27 copy carrying
# GHSA "arbitrary file read when running the development server". The pin stays
# inside the installed major and vite already depends on ^0.28.1 itself.
# Drop this once tsx ships a release that resolves 0.28 on its own.
#
# The brace-expansion / js-yaml / @babel/core pins that used to live here are
# gone: removing the unused template packages (#74) and moving to
# react-router v8 (#76) took their vulnerable paths out of the tree.
overrides:
  esbuild: ^0.28.1
